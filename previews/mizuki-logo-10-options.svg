<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ten Mizuki Shop logo options</title>
  <desc id="desc">Ten web-matched logo options using orange, cyan, and midnight navy.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc080"/><stop offset=".55" stop-color="#ff9142"/><stop offset="1" stop-color="#e9561b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1faff"/><stop offset="1" stop-color="#45d3e4"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .panel{fill:#141c2e;stroke:#2b3850;stroke-width:2}.num{fill:#ff9a4d;font:700 15px Arial;letter-spacing:3px}.word{fill:#f4f7fc;font:800 18px Arial;letter-spacing:2px}.sub{fill:#8fa2ba;font:12px Arial;letter-spacing:1px}.dark{fill:#291108}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1080" rx="36" fill="#0b1020"/>
  <text x="60" y="58" fill="#63dceb" font-family="Arial" font-size="18" font-weight="700" letter-spacing="5">MIZUKI SHOP / 10 LOGO OPTIONS</text>

  <!-- 01 -->
  <g transform="translate(35 95)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">01 / HERO M</text><g transform="translate(57 70) rotate(-8 88 88)"><rect x="12" y="12" width="176" height="176" rx="42" fill="#57240f"/><rect width="176" height="176" rx="42" fill="url(#orange)"/><path d="M32 151V89l56 48 56-48v62h-24v-31l-32 28-32-28v31Z" fill="url(#cyan)"/><path d="m88 35 7 14 14 7-14 7-7 14-7-14-14-7 14-7Z" class="dark"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">hero tile</text></g>
  <!-- 02 -->
  <g transform="translate(345 95)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">02 / CRESCENT M</text><g transform="translate(58 72)"><circle cx="88" cy="88" r="82" fill="url(#orange)"/><circle cx="112" cy="70" r="82" fill="#141c2e"/><path d="M51 125V76l37 31 37-31v49h-16v-24l-21 18-21-18v24Z" fill="url(#cyan)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">elegant moon</text></g>
  <!-- 03 -->
  <g transform="translate(655 95)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">03 / ORBIT M</text><g transform="translate(58 72)"><circle cx="88" cy="88" r="65" fill="#17263a" stroke="url(#orange)" stroke-width="14"/><ellipse cx="88" cy="88" rx="105" ry="35" fill="none" stroke="url(#cyan)" stroke-width="8" transform="rotate(-25 88 88)"/><path d="M49 123V73l39 32 39-32v50h-17V97l-22 18-22-18v26Z" fill="url(#orange)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">always in play</text></g>
  <!-- 04 -->
  <g transform="translate(965 95)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">04 / PORTAL</text><g transform="translate(61 70)"><path d="M28 170V78q0-53 55-53t55 53v92" fill="none" stroke="url(#orange)" stroke-width="17" stroke-linecap="round"/><path d="M53 157V94q0-29 30-29t30 29v63" fill="#17263a" stroke="url(#cyan)" stroke-width="8"/><path d="M54 145V98l29 24 29-24v47h-13v-24l-16 14-16-14v24Z" fill="url(#orange)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">enter the vault</text></g>
  <!-- 05 -->
  <g transform="translate(1275 95)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">05 / PIXEL M</text><g transform="translate(63 72)"><path d="M24 42h34v34h34V42h34v34h34v34h-34v34h-34v34H58v-34H24v-34h34V76H24Z" fill="url(#orange)"/><path d="M58 76h34v34h-34Zm34 34h34v34H92Z" fill="url(#cyan)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">game ready</text></g>

  <!-- 06 -->
  <g transform="translate(35 570)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">06 / COMET M</text><g transform="translate(59 73)"><path d="M27 143 91 28l23 68 62-38-62 94-23-68Z" fill="url(#orange)"/><path d="M80 155 113 98l23 35 35-22-36 51-23-34Z" fill="url(#cyan)"/><circle cx="34" cy="145" r="8" fill="#ffbe7d"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">move forward</text></g>
  <!-- 07 -->
  <g transform="translate(345 570)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">07 / VAULT SPARK</text><g transform="translate(61 70)"><path d="M28 75q0-40 40-40h58q40 0 40 40v81q0 40-40 40H68q-40 0-40-40Z" fill="#17263a" stroke="url(#orange)" stroke-width="14"/><path d="M51 151V93l45 38 45-38v58h-19v-26l-26 22-26-22v26Z" fill="url(#cyan)"/><path d="m96 38 7 14 14 7-14 7-7 14-7-14-14-7 14-7Z" fill="url(#orange)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">premium vault</text></g>
  <!-- 08 -->
  <g transform="translate(655 570)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">08 / PLAY BADGE</text><g transform="translate(61 72)"><circle cx="84" cy="84" r="78" fill="url(#orange)"/><path d="M39 111V62l45 38 45-38v49h-19V87l-26 22-26-22v24Z" fill="#291108"/><path d="m84 23 7 14 14 7-14 7-7 14-7-14-14-7 14-7Z" fill="url(#cyan)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">simple badge</text></g>
  <!-- 09 -->
  <g transform="translate(965 570)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">09 / SIGNAL M</text><g transform="translate(59 73)"><path d="M25 158V40h30v30h30V40h30v30h30v88h-30v-58h-30v58H85v-58H55v58Z" fill="url(#cyan)"/><path d="M25 158h120" stroke="url(#orange)" stroke-width="10" stroke-linecap="round"/><circle cx="172" cy="47" r="12" fill="url(#orange)" filter="url(#glow)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">connected play</text></g>
  <!-- 10 -->
  <g transform="translate(1275 570)"><rect class="panel" width="290" height="430" rx="22"/><text class="num" x="24" y="38">10 / MOON DOT</text><g transform="translate(61 72)"><circle cx="84" cy="84" r="78" fill="#17263a" stroke="url(#cyan)" stroke-width="10"/><circle cx="84" cy="84" r="46" fill="url(#orange)"/><circle cx="101" cy="69" r="46" fill="#17263a"/><circle cx="65" cy="78" r="5" class="dark"/><circle cx="85" cy="78" r="5" class="dark"/><path d="M65 98q10 10 20 0" class="line" stroke="#291108" stroke-width="5"/><path d="m151 24 6 12 12 6-12 6-6 12-6-12-12-6 12-6Z" fill="url(#orange)"/></g><text class="word" x="145" y="310" text-anchor="middle">MIZUKI SHOP</text><text class="sub" x="145" y="337" text-anchor="middle">friendly mark</text></g>
</svg>
