<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Mizuki Shop logo explorations</title>
  <desc id="desc">Three clean logo directions for Mizuki Shop shown on a midnight navy presentation board.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb268"/>
      <stop offset="1" stop-color="#ff7a25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f7ff"/>
      <stop offset="1" stop-color="#42cbdc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="760" rx="36" fill="#0b1020"/>
  <text x="82" y="78" fill="#63dceb" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">MIZUKI SHOP / LOGO DIRECTIONS</text>
  <g transform="translate(60 120)">
    <rect width="440" height="560" rx="28" fill="#141c2e" stroke="#2b3850"/>
    <text x="36" y="52" fill="#ff9d57" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">01 / MOON M</text>
    <g transform="translate(106 104)">
      <circle cx="150" cy="150" r="134" fill="url(#orange)" filter="url(#glow)"/>
      <circle cx="190" cy="120" r="134" fill="#141c2e"/>
      <path d="M103 126l26 44 28-60 28 60 28-44" fill="none" stroke="#63dceb" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="220" y="420" text-anchor="middle" fill="#f4f7fc" font-family="Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="5">MIZUKI SHOP</text>
    <text x="220" y="462" text-anchor="middle" fill="#a8b5c9" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">ELEGANT / MEMORABLE</text>
  </g>
  <g transform="translate(530 120)">
    <rect width="440" height="560" rx="28" fill="#141c2e" stroke="#2b3850"/>
    <text x="36" y="52" fill="#ff9d57" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">02 / MOTION M</text>
    <g transform="translate(85 112)">
      <path d="M35 205V60l108 93L251 60v145h-50v-61l-58 54-58-54v61Z" fill="url(#orange)"/>
      <path d="M143 153l58-93h50l-73 112Z" fill="url(#cyan)" opacity=".95"/>
      <path d="M35 224h216" stroke="#63dceb" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    </g>
    <text x="220" y="420" text-anchor="middle" fill="#f4f7fc" font-family="Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="5">MIZUKI SHOP</text>
    <text x="220" y="462" text-anchor="middle" fill="#a8b5c9" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FAST / CONFIDENT</text>
  </g>
  <g transform="translate(1000 120)">
    <rect width="440" height="560" rx="28" fill="#141c2e" stroke="#2b3850"/>
    <text x="36" y="52" fill="#ff9d57" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">03 / MOON BUDDY</text>
    <g transform="translate(112 105)">
      <circle cx="150" cy="150" r="136" fill="url(#cyan)" filter="url(#glow)"/>
      <circle cx="190" cy="120" r="136" fill="#141c2e"/>
      <circle cx="112" cy="140" r="9" fill="#0b1020"/><circle cx="173" cy="140" r="9" fill="#0b1020"/>
      <path d="M122 184q30 25 60 0" fill="none" stroke="#0b1020" stroke-width="9" stroke-linecap="round"/>
      <path d="M220 44l10 22 22 10-22 10-10 22-10-22-22-10 22-10Z" fill="url(#orange)"/>
    </g>
    <text x="220" y="420" text-anchor="middle" fill="#f4f7fc" font-family="Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="5">MIZUKI SHOP</text>
    <text x="220" y="462" text-anchor="middle" fill="#a8b5c9" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FRIENDLY / COOL</text>
